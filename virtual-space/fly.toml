# Fly.io config — WebSocket server.
# The `app` name is assigned by `fly launch`; if deploying for the first time,
# run `fly launch --copy-config --no-deploy` and accept the generated name,
# or set it here manually.

app = "virtual-space-ws"
primary_region = "nrt"

[build]

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
